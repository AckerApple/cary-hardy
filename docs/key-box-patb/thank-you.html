<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Thank You - Cary Hardy</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1" />
    <link rel="icon" href="../assets/media/icon_64w.png" />
    <link href="../document.css" type="text/css" rel="stylesheet" />
    <link href="../spin.css" type="text/css" rel="stylesheet" />
    <link href="../bounce-in.css" type="text/css" rel="stylesheet" />
    <style>
      body {
        background: #0b0b0b;
        color: #fff;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 3em 1.25em;
        text-align: center;
      }
      .card {
        background: #1f1f1f;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 16px;
        padding: 2em 1.5em;
      }
      .muted {
        opacity: 0.7;
        font-size: 0.9em;
      }
      .cta {
        display: inline-block;
        margin-top: 1.25em;
        padding: 0.6em 1.2em;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.3);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .cta:hover {
        background: rgba(255,255,255,0.08);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Thank you!</h1>
        <p>Your payment was received successfully.</p>
        <p class="muted" id="session-line"></p>
        <a class="cta" href="/index.html">Back to CaryHardy.com</a>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const line = document.getElementById('session-line');
      if (sessionId) {
        line.textContent = `Session ID: ${sessionId}`;
      } else {
        line.textContent = 'Session ID not found.';
      }
    </script>
  </body>
</html>
